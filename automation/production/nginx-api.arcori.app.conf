# api.arcori.app — FastAPI + Dart edge (host nginx).
# Installed by deploy_vps.py to /etc/nginx/sites-available/api.arcori.app
# Marketing site stays on arcori.app (no shared path prefixes).
#
# Public URLs (Flutter dart-defines):
#   ARCORI_API_REST_URL=https://api.arcori.app
#   ARCORI_API_WS_URL=wss://api.arcori.app/ws/authuser
#   ARCORI_DART_WS_URL=wss://api.arcori.app/game/ws/authuser
#
# Upstream: 127.0.0.1:8000 (API), 127.0.0.1:8085 (Dart)
# TLS: /etc/letsencrypt/live/api.arcori.app/ (Certbot; deploy obtains if missing)

# --- HTTPS ---
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name api.arcori.app;

    ssl_certificate /etc/letsencrypt/live/api.arcori.app/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.arcori.app/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/api.arcori.app.access.log;
    error_log /var/log/nginx/api.arcori.app.error.log;

    # Kin claim can include optional gzipped Lottie overrides; default 1m is too small.
    client_max_body_size 20m;

    # FastAPI WebSocket
    location ^~ /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # Dart game WebSocket (prefix /game → container /ws)
    location ^~ /game/ws/ {
        proxy_pass http://127.0.0.1:8085/ws/;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location = /game/health {
        proxy_pass http://127.0.0.1:8085/health;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FastAPI HTTP (REST, /health, /public/auth, …)
    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

# --- HTTP → HTTPS ---
server {
    listen 80;
    listen [::]:80;
    server_name api.arcori.app;
    return 301 https://$host$request_uri;
}
