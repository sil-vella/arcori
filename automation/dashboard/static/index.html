<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>arcori dashboard</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/css/xterm.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <h1>arcori dashboard</h1>
      <p class="subtitle">GUI alternative — CLI <code>wfrun</code> still works as before</p>
    </div>
    <div class="session-meta" id="session-meta">Loading session…</div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <div class="sidebar-header">
        <h2>Scripts</h2>
        <button type="button" id="stop-btn" class="stop-btn" disabled>Stop</button>
      </div>
      <div class="sidebar-body">
        <nav id="accordion-nav" class="accordion-nav" aria-label="Script groups"></nav>
        <div id="accordion-content" class="accordion-content">
          <p class="accordion-placeholder">Select a section</p>
        </div>
      </div>
    </aside>

    <section class="terminal-pane">
      <div class="terminal-header">
        <span id="active-script">No script running</span>
      </div>
      <div id="terminal" class="terminal-host"></div>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@xterm/xterm@5.5.0/lib/xterm.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@xterm/addon-fit@0.10.0/lib/addon-fit.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
